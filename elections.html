<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elections · Bharat eVote</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="elections">
<div id="site-header"></div>

<main class="page">
  <div class="container">
    <div class="page-head">
      <div>
        <span class="eyebrow">Election schedule</span>
        <h1 style="margin-top:8px">Elections</h1>
        <p class="lede">Browse every election on the platform, review candidates and vote while an election is open.</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-outline" href="results.html">Published results</a>
        <a class="btn btn-primary" href="dashboard.html">My dashboard</a>
      </div>
    </div>

    <div class="demo-banner" id="demoBanner" hidden>
      <i data-lucide="flask-conical" class="icon"></i>
      <span><b>Demo mode.</b> These elections are sample records, clearly identified in the interface. Connect Supabase for live data.</span>
    </div>

    <div class="card mt-24">
      <div class="table-tools" style="border-bottom:0">
        <div class="segmented" id="statusFilter">
          <button data-filter="all" class="is-on">All <span class="count" id="cAll">0</span></button>
          <button data-filter="active">Active <span class="count" id="cActive">0</span></button>
          <button data-filter="upcoming">Upcoming <span class="count" id="cUpcoming">0</span></button>
          <button data-filter="closed">Closed <span class="count" id="cClosed">0</span></button>
          <button data-filter="published">Published <span class="count" id="cPublished">0</span></button>
        </div>
        <div class="input-icon" style="margin-left:auto">
          <i data-lucide="search" class="icon"></i>
          <input class="input" id="searchInput" placeholder="Search elections" aria-label="Search elections">
        </div>
        <select class="select" id="categoryFilter" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
      </div>
    </div>

    <div class="election-grid mt-24" id="electionsGrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="card card-pad"><p class="small muted">Loading elections…</p></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/demo-data.js"></script>
<script src="assets/js/remote.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/pages/elections.js"></script>
</body>
</html>
